[package]
name = "swap-prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "swap_prover"
path = "src/lib.rs"

[[bin]]
name = "swap-prover-setup"
path = "src/bin/setup.rs"

[dependencies]
spr-gnark-ffi-prover = { version = "0.10.0" }
swap-program = { path = "../program" }
spr-client = { version = "0.10.0" }
# Match the released SDK's wincode 0.6 transaction types and enable the
# feature required by spr-client 0.10.0's signing helper.
solana-transaction = { version = "4.3", default-features = false, features = ["wincode"] }

[build-dependencies]
spr-gnark-ffi-prover-build = { version = "0.10.0" }
