[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# Use the published SDK.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.7", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
shellexpand = "3"
spl-token-interface = "3.0.0"
spr-client = { version = "0.10.0", features = ["solana-rpc"] }
spr-interface = { version = "0.10.0" }
spr-keypair = { version = "0.10.0" }
spr-program = { version = "0.10.0" }
spr-transaction = { version = "0.10.0" }
spr-user-registry-interface = { version = "0.10.0", features = ["solana"] }
url = "2"

[dev-dependencies]
spr-program-test = { version = "0.10.0", features = ["localnet"] }

[[example]]
name = "register_private_wallet"
path = "examples/register_private_wallet.rs"

[[example]]
name = "deposit_transfer_withdraw"
path = "examples/deposit_transfer_withdraw.rs"

[[example]]
name = "sync_balance"
path = "examples/sync_balance.rs"

[[example]]
name = "read_history"
path = "examples/read_history.rs"

[[example]]
name = "deposit_with_interface_setup"
path = "examples/deposit_with_interface_setup.rs"
